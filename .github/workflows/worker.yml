name: Leaderboard (Cloudflare Worker)

# Deploys worker/ to Cloudflare on every push to main that touches it.
# One-time setup (see worker/README.md): repository secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# CLOUDFLARE_D1_ID and LEADERBOARD_ADMIN_TOKEN. Without them the job only reports that it was skipped.
# Separate steps so a failure shows which part broke; the deployed URL is reported as a notice.

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_D1_ID != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - if: env.HAS_SECRETS != 'true'
        run: echo "::notice::Cloudflare secrets missing, deploy skipped (see worker/README.md)"
      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: "22"
      - name: Install wrangler
        if: env.HAS_SECRETS == 'true'
        run: npm ci
      - name: Check the API token
        if: env.HAS_SECRETS == 'true'
        run: npx wrangler whoami
      - name: Put the D1 database id into wrangler.toml
        if: env.HAS_SECRETS == 'true'
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ secrets.CLOUDFLARE_D1_ID }}/" wrangler.toml
      - name: Apply D1 migrations
        if: env.HAS_SECRETS == 'true'
        run: npx wrangler d1 migrations apply last-bean-standing --remote
      - name: Deploy worker
        if: env.HAS_SECRETS == 'true'
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "::notice title=Leaderboard URL::${url:-not found in wrangler output}"
      - name: Report the workers.dev address
        if: env.HAS_SECRETS == 'true'
        run: |
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('result') or {}).get('subdomain') or '')")
          if [ -n "$sub" ]; then
            echo "::notice title=Leaderboard URL::https://last-bean-standing.$sub.workers.dev"
          else
            echo "::warning title=No workers.dev subdomain::Set one in the Cloudflare dashboard (Workers & Pages), then re-run"
          fi
      - name: Set admin token
        if: env.HAS_SECRETS == 'true'
        env:
          ADMIN_TOKEN: ${{ secrets.LEADERBOARD_ADMIN_TOKEN }}
        run: |
          if [ -n "$ADMIN_TOKEN" ]; then printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN; fi
