name: CI

on:
  push:
  pull_request:

jobs:
  game:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" -r server/requirements.txt  # server deps: leaderboard round-trip test
      - run: ruff check
      - run: ruff format --check
      - run: pytest -q
      - name: Content is in sync with tools/build_content.py
        run: |
          python tools/build_content.py
          git diff --exit-code -- data docs/CONTENT.md
      - run: python tools/bench.py --seconds 30 --render

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
